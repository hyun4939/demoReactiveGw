example-bean:
  list:
    - name: xbean
      value: 11111
    - name: ybean
      value: 22222
    - name: zbean
      value: 33333

eureka:
  instance:
    hostname: t1
    appname: egw

  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:23001/eureka/
    register-with-eureka: true
    fetch-registry: true

spring:
  application:
    name: egw
  cloud:
    netflix:
      ribbon: true
    gateway:
      discovery:
        locator:
          enabled: true
      redis-truststore: # New Properties for Redis TrustStore
        enabled: true # To enable/disable the customizer
        redis:
          host: localhost
          port: 6379
          password: # Optional: password for Redis
          key: "gateway:truststore:jks" # Key where the Base64 JKS is stored
        jks-password: "changeit" # Password for the JKS itself
#      default-filters:
#        - name: CustomFilter
#          args:
#            baseMessage: "message mess"
#            preLogger: true
#            postLogger: true
      routes:
        - id: hsvc
          uri: lb://hsvc
          predicates:
            - Path=/hsvc/**
          filters:
            - CustomFilter
            - name: CacheRequestBody
              args:
                bodyClass: java.lang.String
      filter:
        strip-prefix:
          enabled: true
#      enabled: true
  main:
   web-application-type: reactive

logging:
  level:
    root: debug
server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: '*'
        # refresh,health,env,info,beans,httpexchanges